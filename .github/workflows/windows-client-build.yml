name: Windows client build

on:
  push:
    branches: [windows-client-v0.12.17]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          py -3 -m pip install pyinstaller pillow pywebview
      - name: Verify source
        shell: pwsh
        run: |
          npm test
          py -3 -m unittest discover -s tests -p test_native_render.py
          py -3 -m unittest discover -s tests -p test_server.py
          py -3 -m unittest discover -s tests -p test_upload_transport.py
          py -3 -m unittest discover -s tests -p test_licensing.py
          npm run build
      - name: Build serial-locked customer EXE
        shell: pwsh
        run: |
          Copy-Item license-server.example.json license-server.json
          ./BUILD-EXE.ps1
          if (-not (Test-Path dist/PoknaphamEditingSuite/PoknaphamEditingSuite.exe)) { throw 'Missing EXE' }
      - name: Smoke test customer EXE
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'dist/PoknaphamEditingSuite/PoknaphamEditingSuite.exe') -ArgumentList '--server-only' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $page = Invoke-WebRequest 'http://127.0.0.1:4173/license' -Headers @{ Host = 'localhost:4173' } -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content -match 'Activate Poknapham Editing Suite') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) {
              Get-Content "$env:LOCALAPPDATA/PoknaphamEditingSuite/desktop.log" -ErrorAction SilentlyContinue
              throw 'Customer EXE did not serve its license activation page.'
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Check desktop window opens
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'dist/PoknaphamEditingSuite/PoknaphamEditingSuite.exe') -PassThru
          try {
            $visible = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { break }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { $visible = $true; break }
            }
            if (-not $visible) {
              Get-Content "$env:LOCALAPPDATA/PoknaphamEditingSuite/desktop.log" -ErrorAction SilentlyContinue
              throw 'The desktop EXE did not create its own window.'
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: Poknapham-Client-v0.12.17-Windows
          path: |
            installer/PoknaphamEditingSuite-Setup-v0.12.17.exe
            dist/PoknaphamEditingSuite/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct client installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create client-v0.12.17 installer/PoknaphamEditingSuite-Setup-v0.12.17.exe --target $env:GITHUB_SHA --title 'Poknapham Editing Suite v0.12.17 client installer' --notes 'Windows desktop client installer. Opens in its own window without Chrome or a console. Requires an active serial and internet access. The private owner test edition is not included.' --latest=false
