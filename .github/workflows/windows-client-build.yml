name: Windows client build

on:
  push:
    branches: [windows-client-v0.12.15]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install ffmpeg innosetup -y --no-progress
          py -3 -m pip install pyinstaller pillow
      - name: Verify source
        shell: pwsh
        run: |
          npm test
          py -3 -m unittest discover -s tests -p test_native_render.py
          py -3 -m unittest discover -s tests -p test_server.py
          py -3 -m unittest discover -s tests -p test_upload_transport.py
          py -3 -m unittest discover -s tests -p test_licensing.py
          npm run build
      - name: Build serial-locked customer EXE
        shell: pwsh
        run: |
          Copy-Item license-server.example.json license-server.json
          ./BUILD-EXE.ps1
          if (-not (Test-Path dist/PoknaphamEditingSuite/PoknaphamEditingSuite.exe)) { throw 'Missing EXE' }
      - name: Smoke test customer EXE
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'dist/PoknaphamEditingSuite/PoknaphamEditingSuite.exe') -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $page = Invoke-WebRequest 'http://127.0.0.1:4173/license' -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content -match 'Activate Poknapham Editing Suite') { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw 'Customer EXE did not serve its license activation page.' }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: Poknapham-Client-v0.12.15-Windows
          path: |
            installer/PoknaphamEditingSuite-Setup-v0.12.15.exe
            dist/PoknaphamEditingSuite/**
          if-no-files-found: error
          retention-days: 30
