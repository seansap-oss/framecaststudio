<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameCast Studio · Edit</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="editor-workspace.css"></head><body>
<header><b class="brand">◩ <span>FrameCast</span> Studio</b><small>v0.11.1</small><i></i><strong id="projectTitle" title="Double-click to rename project">Evening bulletin</strong><div class="spacer"></div><button id="reset">Reset layout</button><button id="exportTop" class="gold">Export &amp; share ↗</button></header>
<div id="desk"><nav id="tools" aria-label="Tool windows"></nav><aside id="left" class="dock"></aside><main><div class="bar"><b>Program monitor</b><span class="spacer"></span><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select><button id="full" title="Fullscreen">⛶</button></div><div class="screen"><canvas id="monitor" width="960" height="540"></canvas></div><div class="transport"><button id="homeBtn">|◀</button><button id="play">▶ Play</button><button id="monitorMute" title="Mute monitor">♫</button><input id="listen" aria-label="Monitor volume" type="range" min="0" max="100" value="100"><code id="clock"></code><input id="seek" type="range" min="0" max="8" step=".01" value="0"></div></main><aside id="right" class="dock"></aside>
<section id="timeline"><div class="bar"><b>Timeline</b><button id="collapseTime" title="Collapse timeline">▾</button><button id="expandTime" title="Expand timeline">⤢</button><span class="spacer"></span><button id="addText">＋ Text</button><button id="insertLayers">＋ Insert layers</button><button id="addClips">＋ Video clips</button><button id="addSound">＋ Audio</button></div><div id="tracks"></div></section></div><footer><span class="lamp"></span><span id="status" role="status">Sample project loaded</span><span class="spacer"></span><small>Local workspace</small></footer>
<input hidden id="inserts" type="file" multiple accept="video/*,image/*,audio/*"><input hidden id="videos" type="file" multiple accept="video/*"><input hidden id="sounds" type="file" accept="audio/*"><script src="editor-core.js"></script><script src="sample.js"></script><script src="studio.js"></script><script src="layers.js"></script><script src="timeline.js"></script><script src="editing.js"></script><script src="workspace.js"></script><script src="image-editing.js"></script><script src="editor-workspace.js"></script><script src="tracks.js"></script><script src="publish.js"></script><script src="ticker-inspector.js"></script><script src="render-ranges.js"></script><script src="frame-seek.js"></script><script src="deterministic-export.js"></script></body></html>
